id: ayam-kecap
name: Ayam Kecap (Sweet Soy Braised Chicken)
cuisine: indonesian
difficulty: easy
time: 35
servings: 2
methods:
  - pan-sear
  - braise

tags:
  - high-protein
  - meal-prep
  - one-pan

description: >
  Chicken braised in a sweet soy sauce with garlic, ginger, and shallots — then reduced down
  to a glossy, lacquered glaze. Ayam kecap is one of Indonesia's most comforting weeknight
  dishes: deeply savory, slightly sweet, and dead simple. The sear first, braise second method
  gives you flavorful fond in the pan and chicken that stays juicy. Serve over rice and spoon
  the braising liquid over everything.

keyIngredients:
  - chicken breast
  - kecap manis
  - garlic
  - shallots
  - ginger

ingredientGroups:
  - emoji: 🫙
    label: Braising sauce
    actionNote: mix together before you start cooking
    ingredients:
      - amount: 3 tbsp
        name: kecap manis (sweet soy sauce)
        note: the primary flavor — essential
        alternatives:
          - amount: 2 tbsp soy sauce + 1 tbsp brown sugar
            name: soy sauce + brown sugar
            note: thinner and less complex, but works
      - amount: 1 tbsp
        name: soy sauce
        note: null
        alternatives: []
      - amount: "100ml"
        name: chicken stock or water
        note: just enough to braise; reduces down to a glaze
