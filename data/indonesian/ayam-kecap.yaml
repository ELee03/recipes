instructions:
  - step: Pound chicken breasts to even thickness (~2 cm) if using breasts. Pat dry with paper towel and season with a pinch of salt.
  - step: Mix braising sauce ingredients in a small bowl. Set aside.
  - step: Heat a drizzle of oil in a pan or skillet over medium-high heat. Sear chicken 2–3 min per side until golden. It won't be cooked through — that's fine. Set aside.
  - step: Reduce heat to medium. In the same pan, add a small splash of oil if needed. Sauté shallots 2 min until softened. Add garlic, ginger, and whole spices if using. Cook 1 min.
  - step: Pour in the braising sauce mixture. Bring to a simmer, scraping up any browned bits from the pan.
  - step: Return chicken to the pan. Spoon sauce over the top. Cover and simmer on medium-low for 12–15 min, turning once halfway, until chicken is cooked through (internal temp 74°C / 165°F).
  - step: Remove lid and increase heat to medium-high. Simmer uncovered for 3–5 min, turning chicken occasionally, until the sauce reduces to a thick glaze that coats the chicken.
  - step: Remove whole spices if used. Taste sauce and adjust salt.
  - step: Serve over rice, spooning the glaze generously over everything. Garnish with green onion.

protein:
  grams: "~44–50"
  note: per serving with 175–200g chicken breast per serving

tips:
  - keyword: Pat the chicken dry
    text: Surface moisture is the enemy of a good sear. Wet chicken steams instead of browning. Even 30 seconds with a paper towel makes a difference.
  - keyword: Don't skip the sear
    text: The braising liquid picks up every bit of fond (browned bits) from the pan when you add it. That's why the sauce has depth that raw-chicken braises lack.
  - keyword: Watch the glaze
    text: Kecap manis has a high sugar content and will burn quickly once the liquid reduces. Stay at the pan during the last 3–5 min and keep things moving.
  - keyword: Thighs vs breasts
    text: Thighs are much more forgiving — the collagen converts and the meat stays juicy even if you go a few minutes over. Breasts will dry out if you over-braise; use a thermometer and pull at 74°C.
  - keyword: Maillard then braise
    text: Searing the chicken before braising isn't just for color — it creates hundreds of Maillard reaction compounds that dissolve into the braising liquid as it simmers. A chicken braised without searing produces a paler, thinner sauce because those flavor compounds never formed. The fond on the pan bottom is essentially concentrated Maillard residue, and deglazing with the sauce carries it all into the final glaze.

