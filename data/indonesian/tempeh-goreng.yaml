instructions:
  - step: Slice tempeh into ½ cm thick slabs.
  - step: Mix marinade ingredients in a shallow dish or bowl. Add tempeh slices and toss to coat. Let sit at least 10 min at room temperature, or up to overnight in the fridge.
  - step: Heat oil in a skillet over medium-high heat. Add tempeh slices in a single layer. Fry 2–3 min per side until deep golden brown and slightly crispy on the edges.
  - step: The marinade will caramelize — watch that it doesn't burn. Reduce heat slightly if it darkens too fast.
  - step: Drain on paper towel. Serve over rice with sambal and cucumber.

tips:
  - keyword: Steam before marinating (optional)
    text: Steaming tempeh slices for 5 min before marinating opens the structure slightly, allowing the marinade to penetrate more deeply. This is traditional in some preparations. Skip if short on time — still delicious without.
  - keyword: Caramelization happens fast
    text: Kecap manis has high sugar content and will start to burn before you expect it. Medium-high heat is right for the first side; drop to medium for the second if the pan looks too dark.
  - keyword: Bitter tempeh
    text: If your tempeh tastes bitter or sharp raw, a brief simmer in lightly salted water for 5 min before slicing tones it down. This is common with older or more assertive tempeh blocks.
  - keyword: Tempeh vs tofu for protein
    text: Tempeh is fermented whole soybeans, not pressed soy milk — which gives it fundamentally different nutrition than tofu. The Rhizopus mold (Rhizopus oligosporus) pre-digests the proteins during fermentation, breaking them into shorter peptide chains that the body absorbs more efficiently. It also eliminates most of the phytic acid — the compound in legumes that binds minerals and blocks absorption. The result is that tempeh's protein and minerals (zinc, iron, calcium) are substantially more bioavailable than the equivalent amount in unfermented soy or tofu. Higher fiber content is a further benefit.

