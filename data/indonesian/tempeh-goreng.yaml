id: tempeh-goreng
name: Tempeh Goreng (Fried Tempeh)
cuisine: indonesian
difficulty: easy
time: 20
servings: 2
methods:
  - marinate
  - pan-fry

tags:
  - quick
  - high-protein
  - one-pan

description: >
  Tempeh sliced thin, marinated in a spiced kecap manis mixture, then pan-fried until crispy
  and caramelized. Tempeh goreng is the most common way tempeh gets cooked in Indonesia — and
  for good reason. The fermented slab soaks up marinade deeply and fries into something dense,
  chewy on the inside and crispy on the edges. High protein, fast, and works as a side or
  a main over rice.

