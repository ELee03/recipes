id: jjolmyeon-sesame
name: Spicy Sesame Jjolmyeon (쫄면)
cuisine: korean
difficulty: easy
time: 20
servings: 2
methods:
  - boil
  - toss

tags:
  - quick
  - high-protein
  - no-marinate

description: >
  Jjolmyeon (쫄면) — thick, chewy Korean wheat noodles — tossed in a gochujang-sesame sauce
  with ground chicken or thinly sliced chicken, soft-boiled egg, and julienned cucumber.
  This is the more traditional jjolmyeon preparation (compared to the buldak carbonara version)
  — sharp from vinegar, spicy from gochujang, rich from sesame oil, with the cucumber cutting
  through everything. Works warm or at room temperature, which makes it good for meal prep too.

keyIngredients:
  - jjolmyeon noodles
  - gochujang
  - sesame oil
  - rice vinegar
  - ground chicken
  - cucumber

