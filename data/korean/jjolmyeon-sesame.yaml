instructions:
  - step: Soft-boil eggs — lower into boiling water and cook 6.5 min. Transfer to ice water. Peel and halve.
  - step: Cook protein. For ground chicken or pork — brown in a pan over medium-high heat with a small splash of soy sauce and 1 clove of minced garlic. Drain fat. Set aside.
  - step: Cook jjolmyeon per package instructions. Before draining, scoop out ¼ cup of starchy cooking water.
  - step: Drain noodles but do NOT rinse. Let sit in colander 30 seconds.
  - step: Mix sauce ingredients in a large bowl. Add the starchy noodle water and stir to combine. Taste — adjust gochujang for heat, vinegar for sharpness, honey for sweetness.
  - step: Add hot noodles to the sauce bowl. Toss vigorously until every strand is coated. Add more noodle water if too thick.
  - step: Divide into bowls. Top with protein, julienned cucumber, soft-boiled egg, green onion, and sesame seeds. Serve immediately, or let cool to room temperature before serving.

tips:
  - keyword: Taste the sauce before tossing
    text: Gochujang varies in heat between brands, and the balance of acid, sweet, and spice is very personal here. Taste the sauce before the noodles go in — it should be punchy and slightly over-seasoned, because the noodles dilute it.
  - keyword: Don't skip the cucumber
    text: Jjolmyeon is spicy, rich, and dense. The julienned cucumber is not optional garnish — it's a textural and flavor counterbalance. The cool crunch and water content of the cucumber reset the palate between bites.
  - keyword: Room temperature works
    text: Unlike most noodle dishes, jjolmyeon holds up at room temperature because the sauce is thick and sticky enough to stay on the noodles without breaking. This makes it a solid meal-prep option — portion into containers and eat cold or at room temp.
  - keyword: Julienning cucumber fast
    text: Slice the cucumber lengthwise into planks, stack them, then cut across into thin strips. You don't need a mandoline. A 3–4 cm matchstick is the target length — long enough to fork with noodles, short enough not to be awkward.
  - keyword: Viscosity without emulsification
    text: Jjolmyeon sauce clings via different mechanics than a carbonara or cream sauce. There is no fat-water emulsion here — the gochujang and honey provide inherent viscosity from their natural polymer content (gochujang is a thick paste; honey contains glucose and fructose chains). The rough surface of jjolmyeon then mechanically traps this viscous sauce in its grooves rather than relying on surface tension or emulsification. Adding starchy noodle water contributes some additional thickness, but the primary mechanism is the paste itself adhering to a textured surface — which is why this approach would work less well on smooth, slick noodles.

