instructions:
  - step: Whisk peanut butter, gochujang, soy sauce, sesame oil, rice vinegar, honey, garlic, and ginger together in a bowl. Add warm water one tablespoon at a time, whisking after each addition, until the sauce coats a spoon and runs off slowly. Taste — more gochujang for heat, more vinegar for brightness, more honey to balance.
  - step: Cook protein. Ground chicken — oil a pan over medium-high, add chicken, break up and cook until browned through, ~6–7 min. Season with a small pinch of salt. Drain fat. Set aside. Chicken breast — season with salt, sear 2–3 min per side in a lightly oiled pan, rest 2 min, then slice into strips.
  - step: Cook noodles in well-salted water per package instructions. Reserve 3 tbsp pasta water before draining.
  - step: Drain noodles. Do NOT rinse — surface starch helps the sauce adhere.
  - step: Add sauce to the noodles. Toss vigorously, adding pasta water a splash at a time until the sauce coats every strand evenly.
  - step: Add protein and toss to combine. Taste and adjust seasoning.
  - step: Julienne cucumber. Divide into bowls. Top with cucumber, green onion, sesame seeds, crushed peanuts, chili oil if using, and a lime wedge.

tips:
  - keyword: Sauce consistency is everything
    text: Too thick and it clumps on the noodles, leaving patches bare. Too thin and it slides off. Add water tablespoon by tablespoon until the sauce runs off a spoon slowly — like thick cream. You'll almost always use all 5 tbsp.
  - keyword: Natural peanut butter vs regular
    text: Natural peanut butter (just peanuts + salt) has a cleaner flavor and emulsifies more predictably. Regular peanut butter has added sugar and stabilizers — it works but results in a noticeably sweeter sauce. Reduce or skip the honey if using regular.
  - keyword: Hot or cold
    text: Served immediately, this is saucy and warm — the sauce is glossy and clings aggressively. At room temperature, flavors sharpen and the peanut-sesame character comes forward more. Cold from the fridge the next day, it's closer to cold sesame noodles. All three are good.
  - keyword: The cucumber is structural, not garnish
    text: This is a fat-forward dish by design. The julienned cucumber provides water content and crunch that resets the palate between bites — the same role it plays in jjolmyeon. Without it the dish starts to feel rich and one-note by halfway through the bowl.
  - keyword: Why this dish is deliberately fatty
    text: Three tablespoons of natural peanut butter provides roughly 24g fat — mostly monounsaturated oleic acid, the same fat profile as olive oil. The fat here serves a purpose beyond flavor. Fat-soluble compounds in gochujang and sesame oil dissolve and distribute through the peanut butter fat during mixing, making the sauce taste more complex than its ingredient count suggests. This is also why the dish is intentionally different from the lean Korean pasta dishes in this collection — it fills the fat gap those dishes leave.

