id: spicy-peanut-noodles
name: Spicy Peanut Noodles
cuisine: korean
difficulty: easy
time: 20
servings: 2
methods:
  - boil
  - toss
  - sauté

tags:
  - quick
  - high-protein
  - fusion

description: >
  A gochujang-peanut sauce noodle dish — creamy, spicy, slightly tangy, and deliberately
  fat-rich in a way most of the Korean pasta dishes aren't. Peanut butter and sesame oil
  carry most of the fat, ground chicken or breast carries the protein, and the cucumber
  and vinegar keep it from feeling heavy. Serve hot for a saucier, richer result; let it
  cool to room temperature for something closer to cold sesame noodles.

keyIngredients:
  - peanut butter
  - gochujang
  - sesame oil
  - soy sauce
  - rice vinegar
  - ground chicken

