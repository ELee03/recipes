id: shakshuka
name: Shakshuka (Eggs in Spiced Tomato Sauce)
cuisine: middle-eastern
difficulty: easy
time: 30
servings: 2
methods:
  - sauté
  - simmer

tags:
  - high-protein
  - one-pan
  - pantry-friendly
  - no-marinate

description: >
  Eggs poached directly in a spiced, garlicky tomato sauce — one of the most satisfying
  one-pan meals in the collection. The sauce is built fast (onion, pepper, garlic, cumin,
  smoked paprika, canned tomatoes) and the eggs cook right in the sauce with the lid on.
  Serve with rice or flatbread to scoop everything up. Optional ground beef or lamb turns
  it into a proper high-protein meal.

keyIngredients:
  - canned crushed tomatoes
  - eggs
  - cumin
  - smoked paprika
  - garlic
  - onion

