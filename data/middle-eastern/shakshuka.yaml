instructions:
  - step: If using ground beef or lamb, cook in the pan over medium-high heat, breaking it up, until browned. Drain excess fat. Set aside but leave the pan with any fond.
  - step: Add a drizzle of olive oil to the pan over medium heat. Sauté onion and bell pepper until softened, ~5 min. Add garlic and cook 1 min.
  - step: Add cumin, smoked paprika, coriander, cayenne, and sugar. Stir into the aromatics and cook 1 min to bloom the spices.
  - step: Add tomato paste. Stir and cook 1 min until slightly darkened.
  - step: Add crushed tomatoes and water. Return ground meat if using. Stir to combine. Simmer uncovered over medium heat 8–10 min, stirring occasionally, until the sauce thickens slightly and the flavors meld.
  - step: Taste and adjust salt and seasoning. The sauce should be boldly spiced — it carries the eggs.
  - step: Use a spoon to create small wells in the sauce. Crack an egg into each well. Season the eggs lightly with salt.
  - step: Cover the pan and cook on medium-low until egg whites are just set but yolks are still runny — 5–7 min. Check at 5 min; runny to set is a 1–2 min window.
  - step: Remove from heat. Crumble feta over the top. Garnish with parsley or cilantro and chili flakes. Drizzle olive oil over everything.
  - step: Serve straight from the pan with rice or flatbread.

protein:
  note: eggs only (base); ~65g+ per serving with 450g optional ground beef added

tips:
  - keyword: Check eggs at 5 min
    text: The window between runny yolk and fully set is short — check the eggs at 5 min by gently shaking the pan. If the whites jiggle, give them another 1–2 min. If you're serving with runny yolks, pull them earlier than you think.
  - keyword: Bold sauce is the point
    text: The sauce needs to be well-seasoned on its own. The eggs dilute the flavor slightly as you eat, and the feta adds saltiness — but if the sauce tastes flat before the eggs go in, it will taste flat throughout.
  - keyword: Don't stir after the eggs go in
    text: Once the eggs crack in, resist stirring. The whole point is poached eggs in the sauce — you need the whites to set in place.
  - keyword: Serve from the pan
    text: Shakshuka doesn't transfer well. Serve directly from the skillet or pot — the eggs break and the sauce cools fast if plated.
  - keyword: Acid and egg whites
    text: The acidic tomato sauce does something useful to the eggs — it shifts the denaturation temperature of egg white proteins slightly upward. Egg white proteins (primarily ovalbumin) normally begin coagulating around 60–65°C in a neutral environment, but the acidic pH of the tomato sauce causes them to hold their structure a few degrees longer. In practice this means the egg whites have a slightly wider cooking window before they turn rubbery, giving more control over the final texture when cooking with the lid on.

