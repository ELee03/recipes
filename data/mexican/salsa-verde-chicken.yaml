id: salsa-verde-chicken
name: Salsa Verde Chicken
cuisine: mexican
difficulty: easy
time: 30
servings: 2
methods:
  - braise
  - shred

tags:
  - high-protein
  - meal-prep
  - one-pan
  - pantry-friendly

description: >
  The laziest high-protein meal in the collection. Raw chicken goes in the pan, a jar of
  salsa verde goes over it, lid on, 20 minutes, shred. The tomatillo-based sauce braises
  the chicken completely — tangy, herbaceous, and bright in a way that's completely different
  from chicken tinga's chipotle-red profile. Works over rice, in tacos, in burrito bowls,
  in quesadillas. Gets better overnight.

keyIngredients:
  - chicken breast
  - salsa verde
  - garlic
  - cumin

